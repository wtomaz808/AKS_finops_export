apiVersion: v1
kind: Namespace
metadata:
  name: cost-analysis
  labels:
    app.kubernetes.io/name: aks-cost-analysis
    azure.workload.identity/use: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cost-analysis-export-sa
  namespace: cost-analysis
  labels:
    app.kubernetes.io/name: aks-cost-analysis
    app.kubernetes.io/component: cost-export
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "5ba63e24-763f-4bdd-b7ec-be4670d6a0fe"
    azure.workload.identity/tenant-id: "071a8389-cee6-448e-9015-ce55e029f82f"
# The cost-analysis-agent-svc Service in kube-system already exists on this cluster,
# so it is intentionally not included here.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aks-cost-analysis-export
  namespace: cost-analysis
  labels:
    app.kubernetes.io/name: aks-cost-analysis
    app.kubernetes.io/component: cost-export
spec:
  schedule: "10 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: cost-analysis-export-sa
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: cost-analysis-export
            image: craksprodusgovva.azurecr.us/aks-cost-export:1.0.0
            imagePullPolicy: Always
            args:
            - export
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              capabilities:
                drop:
                - ALL
            env:
            - name: COST_ANALYSIS_URL
              value: "http://cost-analysis-agent-svc.kube-system:9094"
            - name: AZURE_CLOUD
              value: "AzureGovernment"
            - name: CLUSTER_NAME
              value: "aks-paas-dev-usgovva-kites"
            - name: AZURE_STORAGE_BLOB_NAME
              value: "https://finopshubug4x7ytxror47uu.blob.core.usgovcloudapi.net/"
            - name: AZURE_STORAGE_CONTAINER_NAME
              value: "aksexports"
            - name: AZURE_STORAGE_AKS_DATA_PREFIX
              value: "cost-analysis/aks-paas-dev-usgovva-kites/"
            - name: AZURE_STORAGE_COST_EXPORT_PREFIX
              value: "cost-management/"
            - name: AZURE_STORAGE_RESULT_FILE
              value: "cost-analysis/result.csv"
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            resources:
              requests:
                memory: "512Mi"
                cpu: "500m"
              limits:
                memory: "512Mi"
                cpu: "500m"
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: "2Gi"
